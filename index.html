<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionale Barberia</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8322b">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barberia"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#151515;--mut:#6b6b6b;--bd:#ddd6c8;--acc:#c8322b;--inp:#faf8f3;--ok:#1d7a46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#171717;--tx:#f1e9d8;--mut:#9a9488;--bd:#333;--inp:#0f0f0f;--ok:#4cc27f}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#171717;--tx:#f1e9d8;--mut:#9a9488;--bd:#333;--inp:#0f0f0f;--ok:#4cc27f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Poppins,system-ui,sans-serif;padding:0 14px 40px;max-width:1100px;margin:0 auto}
h1{font-size:22px;margin:18px 0 2px}.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:110px;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input,select,textarea{background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;min-width:0}
input[type=number]{width:84px}textarea{width:100%;min-height:60px}
input[type=checkbox],input[type=radio]{width:auto}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}.stats b{display:block;font-size:20px}
.sc{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mut);font-weight:500}
td input:not([type=number]){width:100%}td input[type=number]{width:76px}
.warn{color:#b45309;font-size:13px;margin:3px 0}.good{color:var(--ok)}.bad{color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0}.grid2 input{width:100%}
canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--bd);display:block}
.ph{display:flex;align-items:center;gap:6px}.ph img{height:44px;max-width:60px;object-fit:contain;border-radius:6px;background:var(--inp);border:1px solid var(--bd)}
.ph .btn{padding:5px 9px;font-size:12px;white-space:nowrap}.up{position:relative;overflow:hidden;display:inline-block}.up input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
label{display:inline-flex;gap:6px;align-items:center;margin-right:10px}
</style></head><body>

async function load(){try{const l=localStorage.getItem('barberia');if(l)S=JSON.parse(l)}catch(e){}}
function save(){clearTimeout(tm);setSt('Salvataggio…');tm=setTimeout(()=>{let ok=false;try{localStorage.setItem('barberia',JSON.stringify(S));ok=true}catch(e){}setSt(ok?'Salvato sul dispositivo':'Non salvato')},300)}
const P=id=>S.products.find(p=>p.id===id);
const PH={};
const idb=new Promise(r=>{try{const q=indexedDB.open('barberia',1);q.onupgradeneeded=()=>q.result.createObjectStore('ph');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function idbDo(mode,fn){const d=await idb;if(!d)return null;return new Promise(r=>{try{const t=d.transaction('ph',mode),o=fn(t.objectStore('ph'));t.oncomplete=()=>r(o&&o.result!==undefined?o.result:true);t.onerror=()=>r(null);t.onabort=()=>r(null)}catch(e){r(null)}})}
async function phLoadAll(){await Promise.all(S.products.map(async p=>{const u=await idbDo('readonly',s=>s.get(p.id));if(typeof u==='string'&&u)PH[p.id]=u}))}
async function phSave(id){const ok=PH[id]?await idbDo('readwrite',s=>s.put(PH[id],id)):await idbDo('readwrite',s=>s.delete(id));setSt(ok?'Salvato sul dispositivo':'Foto non salvata')}
function phImg(id){return new Promise(r=>{if(!PH[id]){delete imgs['ph:'+id];return r()}const i=new Image();i.onload=()=>{imgs['ph:'+id]=i;r()};i.onerror=r;i.src=PH[id]})}
function phResize(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
 i.onload=()=>{const m=480,k=Math.min(1,m/Math.max(i.width,i.height)),w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');const png=/png|webp|gif/.test(file.type);if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(i,0,0,w,h);URL.revokeObjectURL(u);
  res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85))};i.onerror=()=>{URL.revokeObjectURL(u);rej()};i.src=u})}
async function phSet(id,file){if(!file)return;try{PH[id]=await phResize(file)}catch(e){alert('Immagine non leggibile');return}
 await phImg(id);await phSave(id);render()}
async function phDel(id){delete PH[id];await phImg(id);await phSave(id);render()}
const val=o=>o.items.reduce((a,i)=>a+(P(i.p)?.price||0)*i.q,0);
const cst=o=>o.items.reduce((a,i)=>a+(P(i.p)?.cost||0)*i.q,0);
const av=o=>o.items.length?Math.min(...o.items.map(i=>{const p=P(i.p);return p&&i.q?Math.floor(p.qty/i.q):0})):0;
function warns(o){const w=[],c=cst(o),v=val(o),ps=o.items.map(i=>P(i.p)).filter(Boolean);
 if(o.price<c)w.push('Prezzo sotto costo: ci rimetti');else if(v&&o.price>=v)w.push('Nessuno sconto rispetto al listino');
 if(ps.length&&ps.every(p=>p.vol&&p.fam&&p.fam===ps[0].fam)){
  const L=o.items.reduce((a,i)=>a+(P(i.p)?.vol||0)*i.q,0)/1000,ppl=o.price/L;
  const b=S.products.filter(p=>p.fam===ps[0].fam&&p.vol).map(p=>({p,l:p.price/(p.vol/1000)})).sort((a,b)=>a.l-b.l)[0];
  if(b&&ppl>b.l+.005)w.push(`Al litro costa ${eur(ppl)} contro ${eur(b.l)} di «${b.p.name} ${b.p.fmt}»: nessuno la sceglierebbe`)}
 if(!av(o))w.push('Scorta insufficiente per questa offerta');return w}
const inp=(t,id,f,v,type='text',x='')=>`<input data-t="${t}" data-id="${id}" data-f="${f}" data-key="${t}:${id}:${f}${x}" ${type==='number'?'type="number" step="any" inputmode="decimal"':''} value="${esc(v)}">`;
const stat=(a,b)=>`<div><span class="mut">${a}</span><b>${b}</b></div>`;
function vMag(){const T=S.products.reduce((a,p)=>({c:a.c+p.qty*p.cost,v:a.v+p.qty*p.price}),{c:0,v:0});
 return `<div class="stats">${stat('Investito',eur(T.c))}${stat('Incasso a listino',eur(T.v))}${stat('Utile potenziale',eur(T.v-T.c))}${stat('Margine',T.v?Math.round((T.v-T.c)/T.v*100)+'%':'-')}</div>
<div class="sc"><table><tr><th>Foto<th>Prodotto<th>Formato<th>Qtà<th>Costo (pago) €<th>Vendita €<th>Margine<th>Ml<th>Famiglia<th></tr>
${S.products.map(p=>{const m=p.price-p.cost;const th=PH[p.id]||IMGS[p.img];return `<tr><td><div class="ph">${th?`<img src="${esc(th)}" alt="">`:''}<span class="btn ghost up">${PH[p.id]?'Cambia':'📷 Foto'}<input type="file" accept="image/*" data-t="photo" data-id="${p.id}"></span>${PH[p.id]?`<button class="btn ghost" data-a="delph" data-id="${p.id}" title="Rimuovi foto">✕</button>`:''}</div><td>${inp('p',p.id,'name',p.name)}<td>${inp('p',p.id,'fmt',p.fmt)}<td>${inp('p',p.id,'qty',p.qty,'number')}<td>${inp('p',p.id,'cost',p.cost,'number')}<td>${inp('p',p.id,'price',p.price,'number')}<td class="${m<0?'bad':'good'}">${eur(m)} · ${p.price?Math.round(m/p.price*100):0}%<td>${inp('p',p.id,'vol',p.vol,'number')}<td>${inp('p',p.id,'fam',p.fam)}<td><button class="btn ghost" data-a="delp" data-id="${p.id}">✕</button></tr>`}).join('')}</table></div>
<div class="row"><button class="btn" data-a="addp">+ Aggiungi prodotto</button><button class="btn ghost" data-a="exp">Esporta backup</button><span class="btn ghost up">Importa backup<input type="file" accept=".json,application/json" data-t="imp"></span><button class="btn ghost" data-a="reset">${rst?'Sicuro? Clicca di nuovo':'Ripristina dati iniziali'}</button></div>
<p class="mut">Con «📷 Foto» carichi un'immagine per ogni prodotto: verrà usata nel volantino al posto di quella predefinita (meglio se scattata su sfondo chiaro e uniforme). I dati restano salvati su questo dispositivo: usa «Esporta backup» ogni tanto, e «Importa backup» per portarli su un altro telefono o PC. «Famiglia» (es. shampoo) serve per controllare che un'offerta non costi più al litro del formato più grande.</p>`}
function offCard(o){const v=val(o),c=cst(o),m=o.price-c;
 return `<div class="card"><div class="row">${inp('o',o.id,'name',o.name)}<button class="btn ghost" data-a="delo" data-id="${o.id}">Elimina</button></div>
${o.items.map((i,k)=>`<div class="row"><select data-t="oi" data-id="${o.id}" data-i="${k}" data-f="p" data-key="oi:${o.id}:${k}:p">${S.products.map(p=>`<option value="${p.id}" ${p.id===i.p?'selected':''}>${esc(p.name+' '+p.fmt)}</option>`).join('')}</select>×<input type="number" data-t="oi" data-id="${o.id}" data-i="${k}" data-f="q" data-key="oi:${o.id}:${k}:q" value="${i.q}"><button class="btn ghost" data-a="deli" data-id="${o.id}" data-i="${k}">✕</button></div>`).join('')}
<button class="btn ghost" data-a="addi" data-id="${o.id}">+ Prodotto</button>
<div class="row"><b>Prezzo offerta €</b>${inp('o',o.id,'price',o.price,'number')}<span class="mut">Listino ${eur(v)} · sconto ${v?Math.round((1-o.price/v)*100):0}%</span></div>
<div class="mut">Costo ${eur(c)} · Margine <b class="${m<0?'bad':'good'}">${eur(m)} (${o.price?Math.round(m/o.price*100):0}%)</b> · Disponibili: ${av(o)}</div>
${o.note?`<div class="mut">💡 ${esc(o.note)}</div>`:''}${warns(o).map(x=>`<div class="warn">⚠ ${esc(x)}</div>`).join('')}
<div class="row"><button class="btn" data-a="fly" data-id="${o.id}">Crea volantino</button></div></div>`}
const vOff=()=>`<div class="row"><button class="btn" data-a="addo">+ Nuova offerta manuale</button></div>${S.offers.map(offCard).join('')||'<p class="mut">Nessuna offerta.</p>'}`;
const imgs={};
const loadImgs=()=>Promise.all([...Object.entries(IMGS),['logo',LOGO],...Object.entries(PH).map(([k,v])=>['ph:'+k,v])].map(([k,s])=>new Promise(r=>{const i=new Image();i.onload=()=>{imgs[k]=i;r()};i.onerror=r;i.src=s})));
function curList(){if(fmode==='one')return S.offers.filter(o=>o.id===(fone||S.offers[0]?.id));const s=sel||S.offers.map(o=>o.id);return S.offers.filter(o=>s.includes(o.id))}
function vFly(){const s=sel||S.offers.map(o=>o.id),f=S.shop;
 return `<div class="card"><div class="row"><label><input type="radio" name="fm" value="all" data-t="fm" ${fmode==='all'?'checked':''}>Tutte le offerte in un volantino</label><label><input type="radio" name="fm" value="one" data-t="fm" ${fmode==='one'?'checked':''}>Offerta singola</label></div>
${fmode==='one'?`<select data-t="fone" data-key="fone">${S.offers.map(o=>`<option value="${o.id}" ${o.id===(fone||S.offers[0]?.id)?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`:`<div class="row">${S.offers.map(o=>`<label><input type="checkbox" data-t="fsel" data-id="${o.id}" ${s.includes(o.id)?'checked':''}>${esc(o.name)}</label>`).join('')}</div>`}
<div class="grid2"><input data-t="s" data-f="name" data-key="s:name" value="${esc(f.name)}" placeholder="Nome negozio"><input data-t="s" data-f="tag" data-key="s:tag" value="${esc(f.tag)}" placeholder="Frase sotto il titolo"><input data-t="s" data-f="foot" data-key="s:foot" value="${esc(f.foot)}" placeholder="Scritta finale"></div>
<div class="row"><button class="btn" data-a="dl">Scarica PNG</button><span class="mut">Il volantino si aggiorna da solo.</span></div></div><canvas id="cv"></canvas>`}
function rr(c,x,y,w,h,r,fill,stroke){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function T(c,t,x,y,font,col,al='left',bl='alphabetic'){c.font=font;c.fillStyle=col;c.textAlign=al;c.textBaseline=bl;c.fillText(t,x,y)}
const FF='Poppins,system-ui,sans-serif';
function card(c,x,y,w,h,o,i){const col=['#2862b0','#d6302a','#3c3c3c'][i%3],s=h/610,hh=Math.round(h*.13);
 rr(c,x,y,w,h,28,'#161616','#3c3c3c');
 c.save();c.beginPath();c.roundRect(x,y,w,h,28);c.clip();c.fillStyle=col;c.fillRect(x,y,w,hh);c.restore();
 let fs=Math.round(hh*.42);c.font=`700 ${fs}px ${FF}`;while(c.measureText(o.name.toUpperCase()).width>w-30&&fs>12){fs--;c.font=`700 ${fs}px ${FF}`}
 T(c,o.name.toUpperCase(),x+w/2,y+hh/2,`700 ${fs}px ${FF}`,'#fff','center','middle');
 const its=[];o.items.forEach(it=>{const p=P(it.p);if(p)for(let k=0;k<Math.min(it.q,3);k++)its.push(p)});
 const top=y+hh+16,bot=y+h*.55,gap=14;let k=(bot-top)/245;
 const dm=()=>its.map(p=>{const im=imgs['ph:'+p.id]||imgs[p.img],cu=!!imgs['ph:'+p.id],hg=(p.sz||220)*k;return{p,im,cu,h:hg,w:im?hg*im.width/im.height:hg*.6}});
 let d=dm(),tot=d.reduce((a,z)=>a+z.w,0)+gap*(d.length-1);if(tot>w-40){k*=(w-40)/tot;d=dm();tot=d.reduce((a,z)=>a+z.w,0)+gap*(d.length-1)}
 let px=x+(w-tot)/2;d.forEach(z=>{if(z.im&&z.cu){c.save();c.beginPath();c.roundRect(px,bot-z.h,z.w,z.h,14);c.clip();c.drawImage(z.im,px,bot-z.h,z.w,z.h);c.restore()}else if(z.im)c.drawImage(z.im,px,bot-z.h,z.w,z.h);else{rr(c,px,bot-z.h,z.w,z.h,12,'#2a2a2a');T(c,z.p.name,px+z.w/2,bot-z.h/2,`500 ${14*s*1.2}px ${FF}`,'#ddd','center','middle')}{const mw=Math.max(z.w+gap-4,60),ft=z.p.fmt||'';let f1=Math.round(h*.03);c.font=`600 ${f1}px ${FF}`;while(c.measureText(z.p.name).width>mw&&f1>10){f1--;c.font=`600 ${f1}px ${FF}`}
  T(c,z.p.name,px+z.w/2,bot+h*.032,`600 ${f1}px ${FF}`,'#f1e9d8','center','middle');
  if(ft){let f2=Math.round(h*.026);c.font=`400 ${f2}px ${FF}`;while(c.measureText(ft).width>mw&&f2>9){f2--;c.font=`400 ${f2}px ${FF}`}T(c,ft,px+z.w/2,bot+h*.032+f1*1.2,`400 ${f2}px ${FF}`,'#9a9488','center','middle')}}
  px+=z.w+gap});
 const v=val(o),sv=v-o.price;
 if(sv>.004){const t=eur(v),fo=`500 ${Math.round(36*s)}px ${FF}`;T(c,t,x+w/2,y+h*.665,fo,'#8a8a8a','center','middle');c.font=fo;const tw=c.measureText(t).width;c.fillStyle='#d6302a';c.fillRect(x+w/2-tw/2-6,y+h*.665+2*s,tw+12,4)}
 rr(c,x+w*.11,y+h*.715,w*.78,h*.19,22*s,'#f1e9d8');
 T(c,eur(o.price),x+w/2,y+h*.715+h*.095,`700 ${Math.round(h*.135)}px ${FF}`,'#080808','center','middle');
 if(sv>.004)T(c,`Risparmi ${eur(sv)}`,x+w/2,y+h*.955,`italic 500 ${Math.round(30*s)}px ${FF}`,'#f1e9d8','center','middle')}
async function drawFlyer(){try{await document.fonts.load(`700 40px Poppins`);await document.fonts.load(`500 30px Poppins`)}catch(e){}
 const cv=$('#cv');if(!cv)return;const L=curList(),n=L.length||1,col=n===1?1:2,cw=col===1?900:560,ch=col===1?1000:520,gap=30,hd=470,W=1240;
 const H=hd+Math.ceil(n/col)*(ch+gap)+20+110;cv.width=W;cv.height=H;const c=cv.getContext('2d');
 c.fillStyle='#080808';c.fillRect(0,0,W,H);
 const lg=imgs.logo;let tx=60;if(lg){const lh=360,lw=lh*lg.width/lg.height;c.drawImage(lg,60,50,lw,lh);tx=60+lw+50}
 else T(c,S.shop.name.toUpperCase(),60,200,`700 60px ${FF}`,'#f1e9d8');
 T(c,'OFFERTE',tx,230,`700 150px ${FF}`,'#f1e9d8');
 T(c,S.shop.name.toUpperCase(),tx+4,285,`500 30px ${FF}`,'#d6302a');
 c.fillStyle='#464646';c.fillRect(tx+4,310,W-60-tx-4,2);
 const words=S.shop.tag.split(' ');let line='',yy=360;c.font=`400 32px ${FF}`;
 words.forEach(w=>{const t=(line+' '+w).trim();if(c.measureText(t).width>W-60-tx){T(c,line,tx+4,yy,`400 32px ${FF}`,'#f1e9d8');yy+=42;line=w}else line=t});T(c,line,tx+4,yy,`400 32px ${FF}`,'#f1e9d8');
 const st=(y0,h0)=>{for(let x=0,i=0;x<W;x+=18,i++){c.fillStyle=['#d6302a','#f1e9d8','#2862b0'][i%3];c.fillRect(x,y0,18,h0)}};st(432,16);
 const x0=(W-(col*cw+(col-1)*gap))/2;
 L.forEach((o,i)=>card(c,x0+(i%col)*(cw+gap),hd+Math.floor(i/col)*(ch+gap),cw,ch,o,i));
 if(!L.length)T(c,'Seleziona almeno un\'offerta',W/2,hd+200,`500 40px ${FF}`,'#9a9488','center');
 st(H-126,16);c.fillStyle='#d6302a';c.fillRect(0,H-110,W,110);T(c,S.shop.foot,W/2,H-55,`700 42px ${FF}`,'#fff','center','middle')}
async function dl(){const cv=$('#cv');if(!cv)return;const blob=await new Promise(r=>cv.toBlob(r,'image/png')),n=(fmode==='one'?'volantino-offerta':'volantino-offerte')+'.png';
 try{const f=new File([blob],n,{type:'image/png'});if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return}}catch(e){if(e&&e.name==='AbortError')return}
 saveBlob(blob,n)}
function saveBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function expBk(){saveBlob(new Blob([JSON.stringify({v:1,S,PH})],{type:'application/json'}),'backup-barberia-'+new Date().toISOString().slice(0,10)+'.json')}
async function impBk(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!j.S||!Array.isArray(j.S.products)||!Array.isArray(j.S.offers))throw 0;
 S=j.S;for(const k of Object.keys(PH))delete PH[k];Object.assign(PH,j.PH||{});sel=null;Object.keys(imgs).filter(k=>k.startsWith('ph:')).forEach(k=>delete imgs[k]);
 save();for(const p of S.products)await phSave(p.id);await loadImgs();render()}catch(e){alert('File di backup non valido')}}
function render(){$('#tabs').innerHTML=[['mag','📦 Magazzino'],['off','🏷️ Offerte'],['fly','🖼️ Volantino']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
 $('#app').innerHTML=tab==='mag'?vMag():tab==='off'?vOff():vFly();if(tab==='fly')drawFlyer()}
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(!d.t)return;
 if(d.t==='imp'){const f=t.files[0];t.value='';impBk(f);return}
 if(d.t==='photo'){const f=t.files[0];t.value='';phSet(d.id,f);return}
 if(d.t==='p'){const p=P(d.id);if(p)p[d.f]=['name','fmt','fam'].includes(d.f)?t.value:num(t.value)}
 else if(d.t==='o'){const o=S.offers.find(x=>x.id===d.id);if(o)o[d.f]=d.f==='price'?num(t.value):t.value}
 else if(d.t==='oi'){const o=S.offers.find(x=>x.id===d.id);if(o)o.items[+d.i][d.f]=d.f==='q'?Math.max(1,Math.round(num(t.value))):t.value}
 else if(d.t==='s')S.shop[d.f]=t.value;
 else if(d.t==='fm')fmode=t.value;else if(d.t==='fone')fone=t.value;
 else if(d.t==='fsel'){sel=sel||S.offers.map(o=>o.id);sel=t.checked?[...new Set([...sel,d.id])]:sel.filter(x=>x!==d.id)}
 save();setTimeout(()=>{const k=document.activeElement?.dataset?.key;render();if(k)document.querySelector(`[data-key="${k}"]`)?.focus()},0)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a,O=()=>S.offers.find(x=>x.id===d.id);
 if(a!=='reset')rst=false;
 if(a==='exp'){expBk();return}if(a==='delph'){phDel(d.id);return}if(a==='dl'){dl();return}
 if(a==='tab')tab=d.v;
 else if(a==='addp')S.products.push({id:rid(),name:'Nuovo prodotto',fmt:'',vol:0,fam:'',qty:0,cost:0,price:0,sz:220});
 else if(a==='delp'){if(PH[d.id])phDel(d.id);S.products=S.products.filter(p=>p.id!==d.id);S.offers.forEach(o=>o.items=o.items.filter(i=>i.p!==d.id))}
 else if(a==='addo'){S.offers.unshift({id:rid(),name:'Nuova offerta',items:[{p:S.products[0]?.id,q:1}],price:S.products[0]?.price||0});sel=null}
 else if(a==='delo'){S.offers=S.offers.filter(o=>o.id!==d.id);sel=null}
 else if(a==='addi'){O().items.push({p:S.products[0]?.id,q:1})}
 else if(a==='deli'){O().items.splice(+d.i,1)}
 else if(a==='fly'){tab='fly';fmode='one';fone=d.id}
 else if(a==='reset'){if(!rst){rst=true;render();return}const ids=Object.keys(PH);S=structuredClone(DEF);sel=null;rst=false;ids.forEach(i=>phDel(i))}
 save();render()});
(async()=>{render();await load();await phLoadAll();await loadImgs();setSt('Salvato sul dispositivo');render();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
